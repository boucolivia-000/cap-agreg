<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f0"><link rel="manifest" href="manifest.webmanifest"><title>Cap Agrég’</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,100..900&display=swap" rel="stylesheet"><style>

,select,textarea{width:100%;background:white;border:1px solid #dcd7d2;border-radius:10px;padding:11px;color:var(--navy)}textarea{min-height:92px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.crumb{font-size:13px;color:#7c827f;margin-bottom:12px}.crumb button{background:none;color:#a65539;padding:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{background:#f6ece6;border-radius:20px;padding:5px 10px;font-size:12px;color:#9b533c}.entry{padding:14px 0;border-bottom:1px solid #eee6dd;display:flex;gap:12px;align-items:center;justify-content:space-between}.entry:last-child{border:0}.entry button.link{background:none;color:var(--navy);text-align:left;font-weight:650;padding:4px 0}.sections{display:grid;gap:16px}.section{border:1px solid #eee1d6;border-radius:15px;padding:15px;background:#fff}.section h3{font-size:17px}.bubble-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin:8px 0;align-items:start}.bubble-row textarea{min-height:66px}.bubble-row button{padding:10px;background:#fff0ec;border-radius:8px;color:#9a4d35}.sheet{max-width:850px;margin:auto;background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,42px);min-height:360px}.sheet-head{font-style:italic;font-size:12px;color:#9b9996}.sheet h1{margin:12px 0 24px}.term{background:#f7f9fa;border:1px solid #ececec;padding:11px;border-radius:10px}.definition{padding:11px;border:1px solid #ececec;border-radius:10px;white-space:pre-wrap}.answer{margin:8px 0 10px 14px;padding:12px 16px;border-left:3px solid #d9a48a;background:#fcf8f4;white-space:pre-wrap}.chip{border-radius:11px;padding:10px 14px;background:#f5f6f6;margin:5px;display:inline-block;color:var(--navy);font-weight:600}.empty{padding:30px;text-align:center;color:#8a8e91}.notice{background:#fff3e6;border:1px solid #f5d6bd;padding:13px;border-radius:12px;margin:16px 0;font-size:13px}.hidden{display:none}.stat{font-size:32px;font-weight:750;color:#bb6244}#b /* Cap Agrég’ V4.7 — catégories, champs et fiche générée */
.category-section h3{color:var(--cat-ink);border-bottom:1px solid var(--cat-soft);padding-bottom:8px}
.category-section .bubble-row{grid-template-columns:minmax(0,35fr) minmax(0,65fr) auto;gap:8px;align-items:stretch}
.category-section .bubble-row textarea{min-width:0;min-height:76px;line-height:1.5;border-radius:10px;padding:12px;resize:vertical}
.category-section .category-left,.category-term,.category-chip{background:var(--cat-left);border:1px solid var(--cat-edge);color:var(--cat-ink);font-size:16px;font-weight:700}
.category-section .category-right,.category-definition,.category-answer{background:var(--cat-right);border:1px solid var(--cat-soft);color:#1C3048;font-size:14px;font-weight:400}
.category-section .bubble-row textarea:focus{outline:2px solid var(--cat-edge);outline-offset:1px}
.category-pair{display:grid;grid-template-columns:minmax(0,35fr) minmax(0,65fr);gap:8px;margin:8px 0}
.category-term,.category-definition{border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.category-summary{margin:8px 0}.category-chip{border-radius:10px;padding:10px 14px;text-align:left;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.category-answer{border-radius:10px;padding:12px;margin-top:5px;white-space:pre-wrap}
@media(max-width:650px){.category-section .bubble-row{grid-template-columns:minmax(0,1fr)}.category-pair{grid-template-columns:minmax(0,1fr)}.category-section .bubble-row button{justify-self:end}}
@media print{.category-term,.category-definition,.category-chip,.category-answer{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Cap Agrég’ V4.7 — Roboto Serif pour les contenus de révision */

.category-section .category-left,.category-term,.category-chip{font-size:16px;font-weight:600}
.category-section .category-right,.category-definition,.category-answer{font-size:14px;font-weight:400}
.studio-page,.studio-page [contenteditable],#studio-editor,.studio-note [contenteditable],.studio-note textarea{font-family:"Roboto Serif",Georgia,serif}
.studio-page h1,.studio-page h2,.studio-page h3{font-family:"Roboto Serif",Georgia,serif;font-weight:700}
@media print{.category-section .bubble-row textarea,.category-term,.category-definition,.category-chip,.category-answer{font-family:"Roboto Serif",Georgia,serif!important}}

.cap-revision-child{margin-left:12px;padding:6px 0 12px 0}.cap-revision-child .link{font-size:.94rem}.cap-resource-section{margin-top:25px;padding:17px;border:1px solid #e4d8ce;border-radius:15px;background:#fffdfb}.cap-resource-entry{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid #eee4dd;padding:13px 0}.cap-resource-actions{display:flex;gap:6px;flex-wrap:wrap}.cap-resource-actions button{width:auto}.cap-embed{border:1px solid #dcd5d0;border-radius:12px;overflow:hidden;margin:16px 0;background:#fff}.cap-embed-title{font-weight:700;padding:10px 14px;background:#f7f3ee}.cap-embed iframe{display:block;width:100%;height:350px;border:0;background:#f4f4f4}.cap-embed-delete{margin:7px 12px;padding:6px 10px;border:1px solid #d8b9b9;border-radius:8px;background:white;color:#953b3b;cursor:pointer}.cap-embed-foot{padding:9px 14px;font-size:12px;color:#666}@media(max-width:600px){.cap-resource-entry{align-items:stretch;flex-direction:column}.cap-embed iframe{height:250px}}
.cap-discipline-art{display:block;width:100%;height:125px;object-fit:contain;border-radius:12px;margin-bottom:8px}.cards .card[data-discipline]{overflow:hidden;background:#fffdfa}.cards .card[data-discipline]:hover{box-shadow:0 5px 20px #182b4020}</style><style>.cap-workspace-nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}.cap-workspace-nav button{border:1px solid #d9d4cf;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}.cap-workspace-nav span,.cap-mirror-note{font-size:12px;color:#6a7280}.cap-fiche-mirror{background:white;border:1px solid #e5e0d9;border-radius:12px;padding:20px;margin:14px 0;line-height:1.5}.cap-fiche-mirror h2{font-family:'Roboto Serif',serif;font-size:19px}.cap-mirror-category{margin-top:12px}.cap-mirror-category h3{font-size:15px;margin-bottom:6px}.cap-mirror-row{display:grid;grid-template-columns:35% 65%;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-family:'Roboto Serif',serif;font-size:14px}.cap-mirror-row strong{font-size:16px}@media(max-width:600px){.cap-mirror-row{grid-template-columns:1fr}}</style><style>#cap-voice-overlay.cap-voice-minimized{position:fixed!important;inset:auto 12px 12px auto!important;width:min(390px,calc(100vw - 24px))!important;height:auto!important;background:transparent!important;z-index:99999!important}#cap-voice-overlay.cap-voice-minimized .cap-voice-dialog{max-height:50vh;overflow:auto;padding:12px!important}#cap-voice-overlay.cap-voice-minimized .cap-voice-help,#cap-voice-overlay.cap-voice-minimized #cap-voice-list{display:none!important}.cap-voice-switch{display:flex;gap:8px;margin:8px 0}.cap-voice-switch button{padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:white}.cap-diagram-controls{display:grid;gap:4px;margin-top:8px}.cap-diagram-controls button{border:1px solid #c9c4bb;border-radius:6px;background:#fff;padding:4px;font-size:12px}.cap-diagram-answer{padding:8px;background:#fff;border-radius:8px;white-space:pre-wrap}.cap-diagram-answer[hidden]{display:none}</style></head><body><header><div class="logo" aria-hidden="true"><img src="icon.svg" alt="" style="width:42px;height:42px"></div><div class="brand">Cap Agrég’ <span style="font:600 11px system-ui;color:#8c3c25;background:#fbe8db;padding:3px 6px;border-radius:8px">V4.7</span></div><nav id="nav"><button data-page="home">Accueil</button><button data-page="courses">Mes cours</button><button data-page="revision">Révisions</button><button data-page="backup">Sauvegarde</button><button data-page="sync">☁ Sync</button></nav></header><div id="backbar"><button data-action="go-back">← Retour</button></div><main id="app"></main><script>
const disciplines=[['Contrôle de gestion','📊'],['Finance','🏦'],['Comptabilité','🧮'],['Management','🧩'],['Droit','⚖️'],['Économie','📈']];
const categoryStyles=[
{name:'Définitions / notions',ink:'#287E45',left:'#F0FAF1',right:'#FAFDFA',edge:'#A6D8AE',soft:'#DCEEDF',aliases:['Définitions','Notions et principes']},
{name:'Auteurs / théories',ink:'#3269C3',left:'#F0F6FF',right:'#FAFCFF',edge:'#A8C6F4',soft:'#DCE8F8',aliases:['Auteurs et théories']},
{name:'Mécanismes / raisonnements',ink:'#9C7800',left:'#FFFBE9',right:'#FFFEF6',edge:'#E9D57E',soft:'#F2E8B8',aliases:['Formules et calculs']},
{name:'Débats / oppositions',ink:'#B74C4C',left:'#FFF3F3',right:'#FFFAFA',edge:'#E9B0B0',soft:'#F5DCDC',aliases:[]},
{name:'Problématiques',ink:'#8050B4',left:'#F8F2FF',right:'#FCFAFF',edge:'#CEB4E9',soft:'#E9DCF6',aliases:[]},
{name:'Exemples / actualités',ink:'#C16C24',left:'#FFF6EC',right:'#FFFCF8',edge:'#EEC79C',soft:'#F5E5D2',aliases:['Actualités','Exemples et applications']},
{name:'Plans de dissertation',ink:'#626B78',left:'#F7F8FA',right:'#FCFCFD',edge:'#C8CDD5',soft:'#E6E8EC',aliases:['Plans et raisonnements']},
{name:'Éléments essentiels à retenir',ink:'#BF477F',left:'#FFF1F7',right:'#FFFAFC',edge:'#E9B0CB',soft:'#F5DCE8',aliases:[]}
];
const categories=categoryStyles.map(c=>[c.name,c.ink]);
function migrateSections(source){const old=source||{},out={};for(const c of categoryStyles){const names=[c.name,...c.aliases];out[c.name]=names.flatMap(n=>Array.isArray(old[n])?old[n].map(r=>({left:String(r.left||''),right:String(r.right||'')})):[])}for(const [name,rows] of Object.entries(old)){if(!categoryStyles.some(c=>c.name===name||c.aliases.includes(name))&&Array.isArray(rows)&&rows.length){out['Éléments essentiels à retenir'].push(...rows)}}return out}
function categoryCss(c){return `--cat-ink:${c.ink};--cat-left:${c.left};--cat-right:${c.right};--cat-edge:${c.edge};--cat-soft:${c.soft}`}

const key='cap-agreg-data-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{programs:[],themes:[],questions:[],fiches:[]}}catch(e){db={programs:[],themes:[],questions:[],fiches:[]}};let page='home',historyPages=[],selected={discipline:'',program:'',theme:'',question:'',fiche:''},mode='full',revealed=new Set(),draft=null;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(key,JSON.stringify(db));if(window.capSync)window.capSync.changed()}catch(e){window.capNotice('Stockage saturé : exporte une sauvegarde.')}};
const by=(collection,id)=>db[collection].find(x=>x.id===id),name=(collection,id)=>by(collection,id)?.name||'',button=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`,heading=(t,s='')=>`<div class="eyebrow">${s}</div><h1>${esc(t)}</h1>`,crumb=()=>`<div class="crumb"><button data-page="courses">Mes cours</button> › ${esc(selected.discipline)} ${selected.program?' › '+esc(name('programs',selected.program)):''} ${selected.theme?' › '+esc(name('themes',selected.theme)):''} ${selected.question?' › '+esc(name('questions',selected.question)):''}</div>`;
function capSaveWorkspace(){
 if(!draft)return true;
 window.capStudio?.capture?.();
 const titleField=document.querySelector('[data-draft-title]');if(titleField)draft.title=titleField.value;
 document.querySelectorAll('[data-cat]').forEach(t=>{const r=draft.sections?.[t.dataset.cat]?.[+t.dataset.index];if(r)r[t.dataset.side]=t.value});
 const notes=document.querySelector('[data-notes]');if(notes)draft.notes=notes.value;
 if(!draft.title?.trim()){window.capNotice('Donne un titre à la fiche avant de changer de vue.');return false}
 const ix=db.fiches.findIndex(f=>f.id===draft.id);
 if(ix<0)db.fiches.push(structuredClone(draft));else db.fiches[ix]=structuredClone(draft);
 selected.fiche=draft.id;save();return true;
}
function capSwitchWorkspace(destination){
 if(!capSaveWorkspace())return;
 if(!draft){const f=by('fiches',selected.fiche);if(!f)return;initDraft(f)}
 navigate(destination);
}
window.capSwitchWorkspace=capSwitchWorkspace;
function capMirrorHtml(f){
 const rows=migrateSections(f.sections);
 return `<section class="cap-fiche-mirror" contenteditable="false"><h2>📄 Fiche de révision — ${esc(f.title||'Sans titre')}</h2><p class="cap-mirror-note">Copie synchronisée depuis la fiche · lecture seule</p>`+
 categoryStyles.map(c=>{const a=rows[c.name]||[];return a.length?`<section class="cap-mirror-category"><h3 style="color:${c.ink}">${esc(c.name)}</h3>`+
 a.map(r=>`<div class="cap-mirror-row"><strong>${esc(r.left)}</strong><div>${esc(r.right).replace(/\n/g,'<br>')}</div></div>`).join('')+'</section>':''}).join('')+'</section>';
}
function navigate(p,record=true){if(record&&p!==page)historyPages.push(page);page=p;render()};function render(){document.getElementById('backbar').style.display=page==='home'?'none':'block';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const el=document.getElementById('app');el.innerHTML=({home:home,courses:courses,programs:programs,themes:themes,questions:questions,fiches:fiches,editor:editor,notebook:()=>window.capStudio?window.capStudio.html():notebookLegacy(),sheet:sheet,revision:revision,backup:backup,sync:syncPage}[page]||home)();}
function home(){return courses()+`<div class="toolbar"><button data-page="revision">🎧 Révisions</button><button data-page="backup">Sauvegardes</button></div>`}
function oldHome(){return heading('Ton espace de préparation','Bienvenue dans Cap Agrég’')+`<p class="muted">Organise tes cours, construis tes fiches et mémorise activement, à ton rythme.</p><div class="cards"><div class="card" data-page="courses"><div class="symbol">📚</div><h3>Mes cours</h3><p class="muted">Disciplines, programmes, thèmes et problématiques</p></div><div class="card" data-page="revision"><div class="symbol">🧠</div><h3>Révision active</h3><p class="muted">Retrouve les réponses en touchant les notions</p></div><div class="card" data-page="backup"><div class="symbol">💾</div><h3>Mes données</h3><p class="muted">Exporter ou restaurer une sauvegarde</p></div></div><div class="cards"><div class="panel"><div class="stat">${db.fiches.length}</div>Fiches créées</div><div class="panel"><div class="stat">${db.programs.length}</div>Programmes</div><div class="panel"><div class="stat">${db.themes.length}</div>Thèmes</div></div><div class="notice">Tes fiches sont enregistrées sur cet appareil. Active la synchronisation dans ☁ Sync pour les retrouver sur tous tes appareils.</div>`}
function courses(){return heading('Mes cours','Bibliothèque')+`<div class="cards">${disciplines.map(([n,i])=>`<div class="card" data-discipline="${esc(n)}"><img class="cap-discipline-art" src="illustration-${({'Droit':'droit','Économie':'economie','Management':'management','Finance':'finance','Contrôle de gestion':'controle','Comptabilité':'comptabilite'})[n]||'droit'}.webp" alt="Illustration ${esc(n)}" loading="lazy"><h3>${esc(n)}</h3><p class="muted">${db.programs.filter(p=>p.discipline===n).length} programme(s)</p></div>`).join('')}</div>`}
function collectionPage(kind,title,parent,filter,next,action,placeholder){const list=db[kind].filter(filter);return crumb()+heading(title,selected.discipline)+`<div class="toolbar">${button('＋ '+action,'add-'+kind)}</div><div class="panel">${list.length?list.map(item=>`<div class="entry cap-click-row" data-select="${kind}" data-id="${item.id}"><button class="link" data-select="${kind}" data-id="${item.id}">${esc(item.name)}</button><div><button class="subtle" data-edit="${kind}" data-id="${item.id}">✎ Modifier</button><button class="subtle" data-remove="${kind}" data-id="${item.id}">Supprimer</button></div></div>`).join(''):`<div class="empty">Aucun élément pour l'instant. Crée ton premier ${placeholder}.</div>`}</div>`}
function programs(){return collectionPage('programs','Programmes',null,p=>p.discipline===selected.discipline,'themes','programme','programme')};function themes(){return collectionPage('themes','Thèmes',null,t=>t.program===selected.program,'questions','thème','thème')};function questions(){return collectionPage('questions','Questions de gestion / Problématiques',null,q=>q.theme===selected.theme,'fiches','question','question')};
function fiches(){let list=db.fiches.filter(f=>f.question===selected.question);return crumb()+heading('Fiches de révision','Bibliothèque')+`<div class="toolbar">${button('＋ Créer une fiche','new-fiche')}${button('Retour aux questions','back-questions','light')}</div><div class="panel">${list.length?list.map(f=>`<div class="entry cap-click-row" data-open-fiche="${f.id}"><div><button class="link" data-open-fiche="${f.id}">${esc(f.title)}</button><div class="muted" style="font-size:12px">${Object.values(f.sections||{}).reduce((n,r)=>n+r.length,0)} notions</div></div><button class="subtle" data-recordings="${esc(f.id)}" title="Enregistrer ou écouter ma voix">🎙️ Ma voix</button><button class="subtle" data-remove="fiches" data-id="${f.id}">Supprimer</button></div>`).join(''):'<div class="empty">Aucune fiche. Commence par créer une fiche guidée.</div>'}</div>`}
function initDraft(f){draft=structuredClone(f||{id:uid(),question:selected.question,title:'',paper:'blank',notes:'',sections:Object.fromEntries(categories.map(([c])=>[c,[]]))});draft.sections=migrateSections(draft.sections)};
function ficheEmbeds(f,editable=false){return (f.embeds||[]).map((r,i)=>`<div class="cap-fiche-embed" data-fiche-embed="${i}">${embedHtml(r.url,r.title)}${editable?`<button type="button" class="cap-embed-delete" data-delete-fiche-embed="${i}">✕ Supprimer ce contenu intégré</button>`:''}</div>`).join('')}
async function addFicheEmbed(){if(!draft)return;const url=await window.capAsk('Lien à intégrer (https://…) :');if(!url)return;const title=await window.capAsk('Titre du contenu :','Ressource intégrée')||'Ressource intégrée';if(!embedHtml(url,title)){window.capNotice('Ce lien ne peut pas être intégré.');return}draft.embeds??=[];draft.embeds.push({url,title});render()}
function editor(){if(!draft)initDraft(by('fiches',selected.fiche));return crumb()+heading(draft.title||'Nouvelle fiche','Gérer une fiche')+`<div class="panel"><div class="field"><label>Titre de la fiche</label><input data-draft-title value="${esc(draft.title)}" placeholder="Ex. Les indicateurs de performance"></div><div class="grid2"><div class="field"><label>Fond de page</label><select data-paper>${[['blank','Blanc'],['lines','Ligné'],['dots','Pointillé'],['grid','Quadrillé'],['seyes','Seyès (illustratif)']].map(([v,n])=>`<option value="${v}" ${draft.paper===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Notes libres</label><textarea data-notes placeholder="Tes notes personnelles">${esc(draft.notes||'')}</textarea></div></div></div><div class="toolbar">${button('Enregistrer et générer ma fiche','save-fiche')}${button('📓 Cahier numérique','switch-notebook','secondary')}<button type='button' data-recordings='${esc(draft.id)}'>🎙️ Ma voix</button>${button('▣ Intégrer','embed-fiche','secondary')}${button('Annuler','cancel-editor','light')}</div><div class="sections">${categoryStyles.map(c=>`<section class="section category-section" style="${categoryCss(c)}"><h3>● ${esc(c.name)}</h3>${draft.sections[c.name].map((r,i)=>`<div class="bubble-row"><textarea class="category-left" spellcheck="true" lang="fr" data-cat="${esc(c.name)}" data-index="${i}" data-side="left" placeholder="Mot, auteur, notion…">${esc(r.left)}</textarea><textarea class="category-right" spellcheck="true" lang="fr" data-cat="${esc(c.name)}" data-index="${i}" data-side="right" placeholder="Définition, explication, théorie…">${esc(r.right)}</textarea><button title="Supprimer la ligne" data-delrow="${esc(c.name)}" data-index="${i}">✕</button></div>`).join('')}<button class="btn secondary small" data-addrow="${esc(c.name)}">＋ Ajouter une ligne</button></section>`).join('')}</div><div class="panel"><h3>Contenus intégrés dans la fiche</h3><div class="toolbar">${button('▣ Intégrer une vidéo, un podcast ou une page','embed-fiche','secondary')}</div>${ficheEmbeds(draft,true)}</div><div class="toolbar">${button('Enregistrer et générer ma fiche','save-fiche')}</div>`}

function notebook(){return window.capStudio?window.capStudio.html():notebookLegacy()}
function notebookLegacy(){if(!draft)initDraft(by('fiches',selected.fiche));return crumb()+heading('Mon cahier numérique','Rédaction libre')+`<p class="muted">Écris et mets en forme ton cours. Le cahier est conservé dans la même fiche que tes notions.</p><div class="panel"><div class="field"><label>Titre de la fiche</label><input data-draft-title value="${esc(draft.title)}"></div><div class="field"><label>Fond du cahier</label><select data-paper>${[['blank','Blanc'],['lines','Ligné'],['dots','Pointillé'],['grid','Quadrillé'],['seyes','Seyès']].map(([v,n])=>`<option value="${v}" ${draft.paper===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="notebook-tools"><button data-format="bold" title="Gras"><b>G</b></button><button data-format="italic" title="Italique"><i>I</i></button><button data-format="underline" title="Souligné"><u>S</u></button><button data-format="insertUnorderedList">• Liste</button><button data-format="insertOrderedList">1. Liste</button><button data-format="formatBlock" data-format-value="h2">Titre</button><button data-format="formatBlock" data-format-value="p">Paragraphe</button><button data-action="insert-table">▦ Tableau</button></div><div id="notebookContent" class="notebook ${draft.paper==='blank'?'':'paper-'+draft.paper}" contenteditable="true" aria-label="Cahier numérique">${draft.notebook||''}</div><div class="toolbar">${button('Enregistrer ma fiche','save-fiche')}${button('← Retour à la fiche guidée','back-editor','light')}</div></div>`}
function sheet(){let f=by('fiches',selected.fiche);if(!f)return '<p>Fiche introuvable.</p>';let q=by('questions',f.question),t=by('themes',q?.theme),p=by('programs',t?.program),sections=migrateSections(f.sections);return `<div class="toolbar">${button('← Mes fiches','back-fiches','light')}${button('Modifier la fiche','edit-fiche','secondary')}${button('📓 Cahier numérique','edit-notebook','secondary')}${button('Fiche complète','view-full',mode==='full'?'':'light')}${button('Synthèse interactive','view-summary',mode==='summary'?'':'light')}<button type="button" data-recordings="${esc(f.id)}">🎙️ Mes enregistrements</button>${button('📚 Ressources','resource-add','secondary')}${button('Imprimer / PDF','print','light')}</div><article class="sheet ${f.paper==='blank'?'':'paper-'+f.paper}"><div class="sheet-head">${esc(p?.discipline||'')} · ${esc(p?.name||'')}<div>Thème : ${esc(t?.name||'')}</div><div>${esc(q?.name||'')}</div></div><h1>${esc(f.title)}</h1>${mode==='summary'?`<p class="muted">Touche chaque notion pour révéler son contenu original.</p><div class="toolbar">${button('Tout afficher','reveal-all','secondary small')}${button('Tout masquer','hide-all','light small')}</div>`:''}${categoryStyles.map(c=>{let cat=c.name,rows=sections[cat]||[];if(!rows.length)return '';return `<section class="category-section category-output" style="${categoryCss(c)};margin-bottom:24px"><h3>${esc(cat)}</h3>${mode==='full'?rows.map(r=>`<div class="category-pair"><div class="category-term">${esc(r.left)}</div><div class="category-definition">${esc(r.right)}</div></div>`).join(''):rows.map((r,i)=>{let k=cat+'|'+i;return `<div class="category-summary"><button class="category-chip" data-reveal="${esc(k)}">${esc(r.left)} ${revealed.has(k)?'−':'＋'}</button>${revealed.has(k)?`<div class="category-answer">${esc(r.right)}</div>`:''}</div>`}).join('')}</section>`}).join('')}${mode==='full'&&f.notebook?`<h3>Cahier numérique</h3><div class="definition" style="white-space:normal">${f.notebook}</div>`:''}${mode==='full'&&f.notes?`<h3>Notes personnelles</h3><div class="definition">${esc(f.notes)}</div>`:''}${ficheEmbeds(f)}${resourceList(f)}</article>`}

function revision(){let fs=db.fiches;return heading('Révisions','Mémorisation active')+`<p class="muted">Choisis une fiche pour réviser les notions et retrouver son cahier numérique associé.</p><div class="panel">${fs.length?fs.map(f=>{let hasNotebook=!!((f.studio?.pages||[]).some(p=>p.html?.replace(/<[^>]*>/g,'').trim()||p.html?.includes('cap-embed'))||f.notebook?.replace(/<[^>]*>/g,'').trim()||f.notebook?.includes('cap-embed'));return `<div class="cap-revision-group"><div class="entry"><button class="link" data-revise="${esc(f.id)}">${esc(f.title)}</button><button class="subtle" data-recordings="${esc(f.id)}" title="Lire ou enregistrer ma voix">▶ Écouter</button><span class="pill">${Object.values(f.sections||{}).reduce((n,r)=>n+r.length,0)} notions</span></div>${hasNotebook?`<div class="cap-revision-child"><button class="link" data-revision-notebook="${esc(f.id)}">📓 Cahier numérique</button></div>`:''}</div>`}).join(''):'<div class="empty">Crée d’abord une fiche depuis « Mes cours ».</div>'}</div>`}
function syncPage(){return window.capSync?window.capSync.page():heading('Synchronisation')+'<p>Chargement…</p>'}
function backup(){return heading('Sauvegarde et restauration','Mes données')+`<div class="panel"><p>Les fiches sont conservées dans le stockage local de ce navigateur. Pour éviter une perte, télécharge une sauvegarde JSON.</p><div class="toolbar">${button('↓ Exporter toutes mes données','export')}${button('↑ Importer une sauvegarde','import','secondary')}</div><input id="importfile" type="file" accept=".json,application/json" class="hidden"><div class="notice">L’importation remplace les données actuellement enregistrées. Pour synchroniser entre appareils, ouvre ☁ Sync et connecte ton compte.</div></div>`}
async function add(kind){let label={programs:'Nom du programme',themes:'Nom du thème',questions:'Question de gestion ou problématique'}[kind];let v=await window.capAsk(label);if(!v?.trim())return;let obj={id:uid(),name:v.trim()};if(kind==='programs')obj.discipline=selected.discipline;if(kind==='themes')obj.program=selected.program;if(kind==='questions')obj.theme=selected.theme;db[kind].push(obj);save();render()}
async function editItem(kind,id){let item=by(kind,id);if(!item)return;let v=await window.capAsk('Modifier le nom',item.name);if(v===null)return;if(!v.trim()){window.capNotice('Le nom ne peut pas être vide.');return}item.name=v.trim();save();render()}
async function remove(kind,id){if(!await window.capConfirm('Supprimer cet élément ? Cette action peut rendre des éléments liés inaccessibles.'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
// V3.9 — audio et bibliothèque de ressources par fiche
function validLink(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch(_){return null}}
function safeText(x){return String(x||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
function resourceList(f){const a=f.resources||[];return `<section class="cap-resource-section"><h3>📚 Ressources de la fiche</h3><div class="toolbar"><button type="button" data-resource-add="${esc(f.id)}">＋ Ajouter une ressource</button></div>${a.length?a.map(r=>`<div class="cap-resource-entry"><div><strong>${esc(r.title)}</strong> <span class="muted">${esc(r.type)}</span>${r.note?`<p>${esc(r.note)}</p>`:''}<div><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Consulter la source</a></div></div><div class="cap-resource-actions"><button type="button" data-resource-embed="${esc(r.id)}" data-resource-fiche="${esc(f.id)}">▣ Intégrer au cahier</button><button type="button" data-resource-delete="${esc(r.id)}" data-resource-fiche="${esc(f.id)}">✕</button></div></div>`).join(''):'<p class="muted">Aucune ressource pour cette fiche.</p>'}</section>`}
async function addResource(id){const f=by('fiches',id);if(!f)return;const title=await window.capAsk('Titre de la ressource :');if(!title?.trim())return;const url=validLink(await window.capAsk('Adresse du lien (https://…) :')||'');if(!url){window.capNotice('Saisis une adresse web valide.');return}const type=await window.capAsk('Type : page web, vidéo, podcast ou PDF','page web')||'page web';const note=await window.capAsk('Note personnelle (facultative) :')||'';(f.resources??=[]).push({id:uid(),title:title.trim(),url,type,note});save();render()}
async function removeResource(fid,rid){const f=by('fiches',fid);if(!f||!await window.capConfirm('Supprimer cette ressource ?'))return;f.resources=(f.resources||[]).filter(r=>r.id!==rid);save();render()}
function embedUrl(raw){const url=validLink(raw);if(!url)return null;const u=new URL(url);let host=u.hostname.replace(/^www\./,'');if(host==='youtube.com'||host==='m.youtube.com'){const id=u.searchParams.get('v');if(id&&/^[\w-]{11}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id;const m=u.pathname.match(/^\/(?:shorts|embed)\/([\w-]{11})/);if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1]}
if(host==='youtu.be'){const id=u.pathname.slice(1).split('/')[0];if(/^[\w-]{11}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id}
if(host==='open.spotify.com'){const m=u.pathname.match(/^\/(?:intl-[^/]+\/)?(episode|show|track|playlist)\/([\w]+)/);if(m)return 'https://open.spotify.com/embed/'+m[1]+'/'+m[2]}
if(host==='player.vimeo.com')return url;
if(host==='vimeo.com'){const m=u.pathname.match(/^\/(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1]}
return url}
function embedHtml(raw,title){const url=embedUrl(raw);if(!url)return '';return `<div class="cap-embed" contenteditable="false"><div class="cap-embed-title">▣ ${esc(title||'Ressource intégrée')}</div><iframe loading="lazy" referrerpolicy="strict-origin-when-cross-origin" src="${esc(url)}" title="${esc(title||'Ressource')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="cap-embed-foot">Si le site refuse l’intégration, <a href="${esc(raw)}" target="_blank" rel="noopener noreferrer">ouvrir la source</a>.</div></div><p></p>`}
window.capExtras={embedHtml,validLink};
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-page],[data-discipline],[data-select],[data-open-fiche],[data-revise],[data-edit],[data-listen],[data-resource-add],[data-resource-delete],[data-resource-embed],[data-delete-fiche-embed],[data-revision-notebook]');if(!b)return;if(b.dataset.deleteFicheEmbed!==undefined){if(draft&&await window.capConfirm("Supprimer ce contenu intégré de la fiche ?")){draft.embeds.splice(+b.dataset.deleteFicheEmbed,1);render()}return}if(b.dataset.revisionNotebook){selected.fiche=b.dataset.revisionNotebook;initDraft(by("fiches",selected.fiche));navigate("notebook");return}if(b.dataset.resourceAdd){addResource(b.dataset.resourceAdd);return}if(b.dataset.resourceDelete){removeResource(b.dataset.resourceFiche,b.dataset.resourceDelete);return}if(b.dataset.resourceEmbed){const f=by('fiches',b.dataset.resourceFiche),r=f?.resources?.find(x=>x.id===b.dataset.resourceEmbed);if(r){selected.fiche=f.id;initDraft(f);window.capPendingEmbed=r;navigate('notebook')}return}if(b.dataset.format){document.getElementById('notebookContent')?.focus();document.execCommand(b.dataset.format,false,b.dataset.formatValue||null);return}if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.discipline){selected={discipline:b.dataset.discipline,program:'',theme:'',question:'',fiche:''};navigate('programs');return}if(b.dataset.select){let k=b.dataset.select,id=b.dataset.id;if(k==='programs'){selected.program=id;selected.theme='';selected.question='';navigate('themes')}if(k==='themes'){selected.theme=id;selected.question='';navigate('questions')}if(k==='questions'){selected.question=id;navigate('fiches')}return}if(b.dataset.openFiche||b.dataset.revise){selected.fiche=b.dataset.openFiche||b.dataset.revise;mode=b.dataset.revise?'summary':'full';revealed.clear();navigate('sheet');return}if(b.dataset.edit){editItem(b.dataset.edit,b.dataset.id);return}if(b.dataset.remove){remove(b.dataset.remove,b.dataset.id);return}if(b.dataset.addrow){draft.sections[b.dataset.addrow].push({left:'',right:''});render();return}if(b.dataset.delrow){draft.sections[b.dataset.delrow].splice(+b.dataset.index,1);render();return}if(b.dataset.reveal){let k=b.dataset.reveal;revealed.has(k)?revealed.delete(k):revealed.add(k);render();return}let a=b.dataset.action;if(!a)return;if(a.startsWith('add-')){add(a.slice(4));return}switch(a){case'go-back':{if((page==='editor'||page==='notebook')&&draft&&!await window.capConfirm('Quitter sans enregistrer les modifications ?'))return;if(page==='editor'||page==='notebook')draft=null;let prev=historyPages.pop()||'home';navigate(prev,false);break}case'new-fiche':selected.fiche='';initDraft(null);navigate('editor');break;case'edit-notebook':initDraft(by('fiches',selected.fiche));navigate('notebook');break;case'edit-fiche':initDraft(by('fiches',selected.fiche));navigate('editor');break;case'save-fiche':if(window.capStudio)window.capStudio.capture();if(!draft.title.trim()){window.capNotice('Ajoute un titre à la fiche.');return}draft.sections=Object.fromEntries(categories.map(([c])=>[c,draft.sections[c].filter(r=>r.left.trim()||r.right.trim())]));let ix=db.fiches.findIndex(x=>x.id===draft.id);if(ix<0)db.fiches.push(draft);else db.fiches[ix]=draft;selected.fiche=draft.id;save();draft=null;mode='full';navigate('sheet');break;case'back-editor':navigate('editor');break;case'insert-table':{let ed=document.getElementById('notebookContent');if(ed){ed.focus();document.execCommand('insertHTML',false,'<table border="1" style="border-collapse:collapse;width:100%"><tbody><tr><td>Cellule</td><td>Cellule</td></tr><tr><td>Cellule</td><td>Cellule</td></tr></tbody></table><p></p>')}break}case'switch-notebook':capSwitchWorkspace('notebook');break;case'switch-editor':capSwitchWorkspace('editor');break;case'open-notebook':capSwitchWorkspace('notebook');break;case'cancel-editor':draft=null;navigate(selected.fiche?'sheet':'fiches');break;case'back-questions':navigate('questions');break;case'back-fiches':navigate('fiches');break;case'view-full':mode='full';render();break;case'view-summary':mode='summary';revealed.clear();render();break;case'reveal-all':{let f=by('fiches',selected.fiche);categories.forEach(([c])=>(migrateSections(f.sections)[c]||[]).forEach((_,i)=>revealed.add(c+'|'+i)));render();break}case'hide-all':revealed.clear();render();break;case'listen-sheet':listenFiche(selected.fiche);break;case'stop-listen':stopAudio();break;case'pause-listen':if('speechSynthesis'in window)window.speechSynthesis.pause();break;case'resume-listen':if('speechSynthesis'in window)window.speechSynthesis.resume();break;case'embed-fiche':addFicheEmbed();break;case'resource-add':addResource(selected.fiche);break;case'print':window.print();break;case'export':{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cap-agreg-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);break}case'import':document.getElementById('importfile').click();break}});
document.addEventListener('input',e=>{let t=e.target;if(!draft)return;if(t.id==='notebookContent')draft.notebook=t.innerHTML;if(t.hasAttribute('data-draft-title'))draft.title=t.value;if(t.hasAttribute('data-notes'))draft.notes=t.value;if(t.dataset.cat){draft.sections[t.dataset.cat][+t.dataset.index][t.dataset.side]=t.value}});document.addEventListener('change',async e=>{let t=e.target;if(t.hasAttribute('data-paper')&&draft){draft.paper=t.value;let ed=document.getElementById('notebookContent');if(ed)ed.className='notebook '+(draft.paper==='blank'?'':'paper-'+draft.paper)}if(t.id==='importfile'&&t.files[0]){try{let obj=JSON.parse(await t.files[0].text());if(!['programs','themes','questions','fiches'].every(k=>Array.isArray(obj[k])))throw Error('Format invalide');if(await window.capConfirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){db=obj;save();navigate('home')}}catch(err){window.capNotice('Impossible d’importer ce fichier : '+err.message)}}});render();if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.getRegistrations().then(async regs=>{
    const base=new URL('./',location.href).href;
    for(const r of regs){if(r.scope===base)await r.unregister()}
    const names=await caches.keys();
    await Promise.all(names.filter(n=>n.startsWith('cap-agreg-')).map(n=>caches.delete(n)));
    
  }).catch(()=>{});
}

/* Cap Agrég' V3 — Cahier Studio. Contenu stocké dans chaque fiche (synchronisée). */
(()=>{'use strict';
const css=`.studio-page .cap-embed{position:relative}.studio-page .cap-embed .cap-embed-delete{display:block;margin:8px 12px}.studio-bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0}.studio-bar button,.studio-bar select,.studio-bar input{width:auto;padding:8px;border:1px solid #e1d6cc;border-radius:9px;background:#fff}.studio-tabs button.on{background:#c65d3d;color:white}.studio-page{min-height:540px;background:white;border:1px solid #e8dfd5;border-radius:12px;padding:28px;outline:none;line-height:1.65}.studio-page:focus{border-color:#528b7e}.studio-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.studio-layout.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.studio-resource{border:1px solid #e8dfd5;background:#fff;border-radius:12px;padding:15px;min-width:0}.studio-resource textarea{min-height:330px}.studio-board-wrap{overflow:auto;max-height:75vh;border:1px solid #e8dfd5;border-radius:12px;background:#e8e8e8}.studio-board{position:relative;width:1600px;height:1050px;transform-origin:top left;background-color:white;background-image:linear-gradient(#c9d5e04d 1px,transparent 1px),linear-gradient(90deg,#c9d5e04d 1px,transparent 1px);background-size:25px 25px;touch-action:none}.studio-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.studio-note{position:absolute;min-width:135px;min-height:75px;max-width:330px;padding:14px 12px 8px;border-radius:10px;box-shadow:0 4px 12px #0002;cursor:grab;touch-action:none;user-select:none;overflow-wrap:anywhere}.studio-note .studio-edit{outline:none;cursor:text;user-select:text;min-height:35px}.studio-note .studio-handle{font-size:12px;opacity:.65;cursor:grab;margin-bottom:5px}.studio-note .studio-x{float:right;border:0;background:transparent;color:#6b4d3c}.studio-notice{font-size:12px;color:#666}.studio-ink{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px}.studio-ink input[type=color]{appearance:none;-webkit-appearance:none document.addEventListener('click',async e=>{let remove=e.target.closest('[data-remove-studio-embed]');if(remove){e.preventDefault();e.stopPropagation();if(await window.capConfirm('Supprimer ce contenu intégré du cahier numérique ?')){remove.closest('.cap-embed')?.remove();capture()}return}let ink=e.target.closest('[data-ink]');if(ink&&draft){applyInk(ink.dataset.ink==='text'?'foreColor':ink.dataset.ink==='clear'?'removeHighlight':'hiliteColor',ink.dataset.inkValue);return}let color=e.target.closest('[data-note-color]');if(color){const i=getNote(color.dataset.noteContext,color.dataset.noteColor);if(i){i.color=color.dataset.colorValue;const el=color.closest('.studio-note');if(el)el.style.background=i.color}return}let del=e.target.closest('[data-studio-del]');if(del){if(del.dataset.noteContext==='page'){page().stickers=notesForPage().filter(i=>i.id!==del.dataset.studioDel);refresh()}else{board().items=board().items.filter(i=>i.id!==del.dataset.studioDel);paint()}return}let el=e.target.closest('[data-studio]');if(!el)return;let a=el.dataset.studio;if(!draft)return;capture();let s=state();if(a==='embed-add'){const url=await window.capAsk('Colle le lien de la page, vidéo ou podcast à intégrer (https://…) :');if(!url)return;const title=await window.capAsk('Titre de la ressource :','Ressource intégrée')||'Ressource intégrée';const html=window.capExtras?.embedHtml(url,title);if(!html){window.capNotice('Adresse invalide.');return}if(active==='pages'){const ed=document.getElementById('studio-editor');if(ed){ed.focus();document.execCommand('insertHTML',false,html);page().html=ed.innerHTML.replace(/<button[^>]*data-remove-studio-embed[^>]*>[\s\S]*?<\/button>/g,'');draft.notebook=page().html}}else{window.capNotice('Pour intégrer la ressource, passe en mode Pages. Elle sera conservée dans ton cahier.')}return}if(a==='save'){let btn=document.querySelector('[data-action="save-fiche"]');if(!draft.title.trim())draft.title='Cahier numérique';draft.notebook=page().html;btn?.click();return}if(a==='tab-pages'||a==='tab-board'){if(a==='tab-board')syncPageToBoard();active=a==='tab-pages'?'pages':'board';refresh();return}if(a==='toggle-split'){s.split=!s.split;refresh();return}if(a==='add-page'){s.pages.push({id:id(),name:'Page '+(s.pages.length+1),html:'',paper:'blank'});s.activePage=s.pages.at(-1).id;refresh();return}if(a==='add-board'){s.boards.push({id:id(),name:'Tableau '+(s.boards.length+1),items:[],strokes:[]});s.activeBoard=s.boards.at(-1).id;refresh();return}if(a==='rename-page'||a==='rename-board'){let x=a==='rename-page'?page():board(),v=await window.capAsk('Nom',x.name);if(v?.trim())x.name=v.trim();refresh();return}if(a==='delete-page'||a==='delete-board'){let isPage=a==='delete-page',arr=isPage?s.pages:s.boards;if(arr.length===1){window.capNotice('Conserve au moins un espace.');return}if(await window.capConfirm('Supprimer cet espace ?')){let x=isPage?page():board(),idx=arr.indexOf(x);arr.splice(idx,1);if(isPage)s.activePage=arr[0].id;else s.activeBoard=arr[0].id;refresh()}return}if(a==='note'||a==='node'){board().items.push({id:id(),type:a==='node'?'node':'note',text:a==='node'?'Nouvelle notion':'Nouvelle note',x:100+(board().items.length%5)*185,y:110+Math.floor(board().items.length/5)*130});paint();return}if(a==='draw'||a==='move'){tool=a;el.style.background='#d8f1e6';return}if(a==='undo-stroke'){board().strokes.pop();paint();return}if(a==='table'){document.execCommand('insertHTML',false,'<table border="1" style="width:100%;border-collapse:collapse"><tr><td>Colonne 1</td><td>Colonne 2</td></tr><tr><td> </td><td> </td></tr></table><p></p>');return}if(a==='postit-page'){let items=notesForPage(),i=items.length;items.push({id:id(),type:'note',text:'Écris ton post-it ici…',x:35+(i%3)*45,y:100+(i%5)*45,w:210,h:155,color:'#FFF1A8'});refresh();return}if(a==='add-ref'){let name=await window.capAsk('Titre de la référence');if(!name?.trim())return;let url=await window.capAsk('Lien URL (facultatif)')||'';s.refs.push({id:id(),name:name.trim(),url});window.capNotice('Référence ajoutée à cette fiche.');return}if(a==='refs'){window.capNotice(s.refs.length?s.refs.map(x=>x.name+(x.url?' — '+x.url:'')).join('\n'):'Aucune référence enregistrée.');return}if(['bold','italic','underline','insertUnorderedList'].includes(a)){document.getElementById('studio-editor')?.focus();document.execCommand(a,false,null)}});
document.addEventListener('change',e=>{let t=e.target;if(!draft)return;let s=state();if(t.dataset.studioSelect){capture();if(t.dataset.studioSelect==='page')s.activePage=t.value;else s.activeBoard=t.value;refresh()}if(t.dataset.studioPaper){page().paper=t.value;capture();refresh()}if(t.dataset.studioFont){restoreSelection();document.execCommand('fontName',false,t.value);const ed=document.getElementById('studio-editor');if(ed){page().html=ed.innerHTML.replace(/<button[^>]*data-remove-studio-embed[^>]*>[\s\S]*?<\/button>/g,'');draft.notebook=page().html}}if(t.dataset.studioWeight){restoreSelection();const ed=document.getElementById('studio-editor');const sel=window.getSelection();if(ed&&sel&&sel.rangeCount){const r=sel.getRangeAt(0);if(!r.collapsed&&ed.contains(r.commonAncestorContainer)){const span=document.createElement('span');span.style.fontWeight=t.value;try{r.surroundContents(span)}catch(_){const contents=r.extractContents();span.appendChild(contents);r.insertNode(span)}page().html=ed.innerHTML.replace(/<button[^>]*data-remove-studio-embed[^>]*>[\s\S]*?<\/button>/g,'');draft.notebook=page().html;rememberSelection()}}}if(t.dataset.studioSize){document.getElementById('studio-editor')?.focus();document.execCommand('fontSize',false,t.value)}if(t.dataset.studioColor)applyInk('foreColor',t.value);if(t.dataset.studioHighlight)applyInk('hiliteColor',t.value);if(t.dataset.noteCustom){let i=getNote(t.dataset.noteContext,t.dataset.noteCustom);if(i){i.color=t.value;const el=t.closest('.studio-note');if(el)el.style.background=i.color}}if(t.dataset.studioZoom){zoom=Number(t.value);refresh()}});
document.addEventListener('input',e=>{let t=e.target;if(!draft)return;if(t.id==='studio-editor'){page().html=t.innerHTML;draft.notebook=t.innerHTML}if(t.dataset.studioText){let i=getNote(t.dataset.noteContext,t.dataset.studioText);if(i&&!i.sourceId){i.text=t.textContent}}if(t.id==='studio-resource-text')state().resource=t.value});
document.addEventListener('pointerdown',e=>{if(!draft)return;let handle=e.target.closest('[data-studio-handle]'),area=e.target.closest('#studio-board');if(handle){const context=handle.dataset.noteContext,i=getNote(context,handle.dataset.studioHandle);if(i){const host=document.getElementById(context==='page'?'studio-page-area':'studio-board');drag={id:i.id,context,startX:e.clientX,startY:e.clientY,x:i.x,y:i.y,scale:context==='board'?zoom:1};e.preventDefault()}return}if(active==='board'&&area&&tool==='draw'&&!e.target.closest('.studio-note')){draw=true;points=[coords(e)];e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(drag){let i=getNote(drag.context,drag.id);if(i){i.x=Math.max(0,Math.round(drag.x+(e.clientX-drag.startX)/drag.scale));i.y=Math.max(0,Math.round(drag.y+(e.clientY-drag.startY)/drag.scale));let el=document.querySelector(`[data-studio-item="${i.id}"]`);if(el){el.style.left=i.x+'px';el.style.top=i.y+'px'}if(drag.context==='board'){let nodes=board().items.filter(x=>x.type==='node'),links=document.getElementById('studio-links');if(links)links.innerHTML=nodes.slice(1).map((n,k)=>`<line x1="${nodes[k].x+65}" y1="${nodes[k].y+50}" x2="${n.x+65}" y2="${n.y+50}" stroke="#528b7e" stroke-width="2"/>`).join('')}}}if(draw){points.push(coords(e));let el=document.getElementById('studio-current');if(el)el.setAttribute('d',path(points))}});
document.addEventListener('pointerup',()=>{if(draft)document.querySelectorAll('.studio-note[data-studio-item]').forEach(el=>{const i=getNote(el.dataset.noteContext,el.dataset.studioItem);if(i){i.w=Math.round(el.offsetWidth);i.h=Math.round(el.offsetHeight)}});if(draw){board().strokes.push(path(points));draw=false;points=[];paint()}drag=null});
})();
