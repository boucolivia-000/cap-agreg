:root{--navy:#172c42;--peach:#f7d6c5;--cream:#fffaf4;--sage:#528b7e;--terra:#c65d3d;--line:#e8dfd5}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:white;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:4}.brand{font-family:Georgia,serif;font-size:25px;font-weight:bold;white-space:nowrap}.logo{width:48px;height:48px;border-radius:14px;background:#fff0e6;display:grid;place-items:center;font-size:30px}nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}nav button,.subtle{background:transparent;color:#405365;border-radius:10px;padding:9px 12px}nav button.active,nav button:hover{background:#fbe8db;color:#8c3c25}main{max-width:1100px;margin:28px auto;padding:0 16px 90px}h1{font:700 32px Georgia,serif;margin:0 0 10px}h2{font:700 23px Georgia,serif}h3{margin:0 0 10px}.muted{color:#7b8288}.eyebrow{color:#a17a6b;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 5px 20px #55412a0a}.card{cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-2px);border-color:#d6ac98}.card .symbol{font-size:28px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}.btn{background:var(--terra);color:white;border-radius:11px;padding:11px 16px;font-weight:600}.btn.secondary{background:#eaf4ef;color:#276b5d}.btn.light{background:#f8eee8;color:#894d36}.btn.danger{background:#fff0f0;color:#a63b3b}.small{padding:6px 10px;font-size:13px}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-size:13px;color:#5b6671;font-weight:650}input,select,textarea{width:100%;background:white;border:1px solid #dcd7d2;border-radius:10px;padding:11px;color:var(--navy)}textarea{min-height:92px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.crumb{font-size:13px;color:#7c827f;margin-bottom:12px}.crumb button{background:none;color:#a65539;padding:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{background:#f6ece6;border-radius:20px;padding:5px 10px;font-size:12px;color:#9b533c}.entry{padding:14px 0;border-bottom:1px solid #eee6dd;display:flex;gap:12px;align-items:center;justify-content:space-between}.entry:last-child{border:0}.entry button.link{background:none;color:var(--navy);text-align:left;font-weight:650;padding:4px 0}.sections{display:grid;gap:16px}.section{border:1px solid #eee1d6;border-radius:15px;padding:15px;background:#fff}.section h3{font-size:17px}.bubble-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin:8px 0;align-items:start}.bubble-row textarea{min-height:66px}.bubble-row button{padding:10px;background:#fff0ec;border-radius:8px;color:#9a4d35}.sheet{max-width:850px;margin:auto;background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,42px);min-height:360px}.sheet-head{font-style:italic;font-size:12px;color:#9b9996}.sheet h1{margin:12px 0 24px}.term{background:#f7f9fa;border:1px solid #ececec;padding:11px;border-radius:10px}.definition{padding:11px;border:1px solid #ececec;border-radius:10px;white-space:pre-wrap}.answer{margin:8px 0 10px 14px;padding:12px 16px;border-left:3px solid #d9a48a;background:#fcf8f4;white-space:pre-wrap}.chip{border-radius:11px;padding:10px 14px;background:#f5f6f6;margin:5px;display:inline-block;color:var(--navy);font-weight:600}.empty{padding:30px;text-align:center;color:#8a8e91}.notice{background:#fff3e6;border:1px solid #f5d6bd;padding:13px;border-radius:12px;margin:16px 0;font-size:13px}.hidden{display:none}.stat{font-size:32px;font-weight:750;color:#bb6244}#backbar{max-width:1100px;margin:10px auto -12px;padding:0 16px;display:none}#backbar button{background:#f8eee8;color:#894d36;border-radius:10px;padding:8px 13px}.notebook{min-height:340px;padding:22px;border:1px solid #d7d4ce;border-radius:12px;outline:none;line-height:1.7;white-space:normal}.notebook:empty:before{content:"Écris ici ton cours, tes exemples, tes formules…";color:#9b9b9b}.notebook-tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.notebook-tools button{background:#f6eee8;border-radius:8px;padding:7px 10px}.paper-lines{background-image:repeating-linear-gradient(transparent 0px,transparent 29px,#c6d4e633 30px)}.paper-dots{background-image:radial-gradient(#b9c4ca 1px,transparent 1px);background-size:18px 18px}.paper-grid{background-image:linear-gradient(#b8c7da50 1px,transparent 1px),linear-gradient(90deg,#b8c7da50 1px,transparent 1px);background-size:20px 20px}.paper-seyes{background-image:linear-gradient(#dca7a755 1px,transparent 1px),linear-gradient(90deg,#aac4e655 1px,transparent 1px),linear-gradient(#aac4e62b 1px,transparent 1px),linear-gradient(90deg,#aac4e62b 1px,transparent 1px);background-size:40px 40px,40px 40px,10px 10px,10px 10px}@media(max-width:650px){header{flex-wrap:wrap}.brand{font-size:22px}nav{width:100%;justify-content:space-between}nav button{padding:7px}.grid2{grid-template-columns:1fr}.bubble-row{grid-template-columns:1fr}.bubble-row button{justify-self:end}main{margin-top:18px}.sheet{padding:18px}}
</style></head><body><header><div class="logo" aria-hidden="true"><img src="icon.svg" alt="" style="width:42px;height:42px"></div><div class="brand">Cap Agrég’</div><nav id="nav"><button data-page="home">Accueil</button><button data-page="courses">Mes cours</button><button data-page="revision">Révisions</button><button data-page="backup">Sauvegarde</button><button data-page="sync">☁ Sync</button></nav></header><div id="backbar"><button data-action="go-back">← Retour</button></div><main id="app"></main><script>
const disciplines=[['Contrôle de gestion','📊'],['Finance','🏦'],['Comptabilité','🧮'],['Management','🧩'],['Droit','⚖️'],['Économie','📈']];
const categories=[['Définitions','#2563eb'],['Auteurs et théories','#8b5cf6'],['Notions et principes','#0d9488'],['Actualités','#ea580c'],['Formules et calculs','#b45309'],['Exemples et applications','#be185d'],['Plans et raisonnements','#475569']];
const key='cap-agreg-data-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{programs:[],themes:[],questions:[],fiches:[]}}catch(e){db={programs:[],themes:[],questions:[],fiches:[]}};let page='home',historyPages=[],selected={discipline:'',program:'',theme:'',question:'',fiche:''},mode='full',revealed=new Set(),draft=null;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(key,JSON.stringify(db));if(window.capSync)window.capSync.changed()}catch(e){alert('Stockage saturé : exporte une sauvegarde.')}};
const by=(collection,id)=>db[collection].find(x=>x.id===id),name=(collection,id)=>by(collection,id)?.name||'',button=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`,heading=(t,s='')=>`<div class="eyebrow">${s}</div><h1>${esc(t)}</h1>`,crumb=()=>`<div class="crumb"><button data-page="courses">Mes cours</button> › ${esc(selected.discipline)} ${selected.program?' › '+esc(name('programs',selected.program)):''} ${selected.theme?' › '+esc(name('themes',selected.theme)):''} ${selected.question?' › '+esc(name('questions',selected.question)):''}</div>`;
function navigate(p,record=true){if(record&&p!==page)historyPages.push(page);page=p;render()};function render(){document.getElementById('backbar').style.display=page==='home'?'none':'block';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const el=document.getElementById('app');el.innerHTML=({home:home,courses:courses,programs:programs,themes:themes,questions:questions,fiches:fiches,editor:editor,notebook:()=>window.capStudio?window.capStudio.html():notebookLegacy(),sheet:sheet,revision:revision,backup:backup,sync:syncPage}[page]||home)();}
function home(){return heading('Ton espace de préparation','Bienvenue dans Cap Agrég’')+`<p class="muted">Organise tes cours, construis tes fiches et mémorise activement, à ton rythme.</p><div class="cards"><div class="card" data-page="courses"><div class="symbol">📚</div><h3>Mes cours</h3><p class="muted">Disciplines, programmes, thèmes et problématiques</p></div><div class="card" data-page="revision"><div class="symbol">🧠</div><h3>Révision active</h3><p class="muted">Retrouve les réponses en touchant les notions</p></div><div class="card" data-page="backup"><div class="symbol">💾</div><h3>Mes données</h3><p class="muted">Exporter ou restaurer une sauvegarde</p></div></div><div class="cards"><div class="panel"><div class="stat">${db.fiches.length}</div>Fiches créées</div><div class="panel"><div class="stat">${db.programs.length}</div>Programmes</div><div class="panel"><div class="stat">${db.themes.length}</div>Thèmes</div></div><div class="notice">Tes fiches sont enregistrées sur cet appareil. Active la synchronisation dans ☁ Sync pour les retrouver sur tous tes appareils.</div>`}
function courses(){return heading('Mes cours','Bibliothèque')+`<div class="cards">${disciplines.map(([n,i])=>`<div class="card" data-discipline="${esc(n)}"><div class="symbol">${i}</div><h3>${esc(n)}</h3><p class="muted">${db.programs.filter(p=>p.discipline===n).length} programme(s)</p></div>`).join('')}</div>`}
function collectionPage(kind,title,parent,filter,next,action,placeholder){const list=db[kind].filter(filter);return crumb()+heading(title,selected.discipline)+`<div class="toolbar">${button('＋ '+action,'add-'+kind)}</div><div class="panel">${list.length?list.map(item=>`<div class="entry"><button class="link" data-select="${kind}" data-id="${item.id}">${esc(item.name)}</button><div><button class="subtle" data-edit="${kind}" data-id="${item.id}">✎ Modifier</button><button class="subtle" data-remove="${kind}" data-id="${item.id}">Supprimer</button></div></div>`).join(''):`<div class="empty">Aucun élément pour l'instant. Crée ton premier ${placeholder}.</div>`}</div>`}
function programs(){return collectionPage('programs','Programmes',null,p=>p.discipline===selected.discipline,'themes','programme','programme')};function themes(){return collectionPage('themes','Thèmes',null,t=>t.program===selected.program,'questions','thème','thème')};function questions(){return collectionPage('questions','Questions de gestion / Problématiques',null,q=>q.theme===selected.theme,'fiches','question','question')};
function fiches(){let list=db.fiches.filter(f=>f.question===selected.question);return crumb()+heading('Fiches de révision','Bibliothèque')+`<div class="toolbar">${button('＋ Créer une fiche','new-fiche')}${button('Retour aux questions','back-questions','light')}</div><div class="panel">${list.length?list.map(f=>`<div class="entry"><div><button class="link" data-open-fiche="${f.id}">${esc(f.title)}</button><div class="muted" style="font-size:12px">${Object.values(f.sections||{}).reduce((n,r)=>n+r.length,0)} notions</div></div><button class="subtle" data-remove="fiches" data-id="${f.id}">Supprimer</button></div>`).join(''):'<div class="empty">Aucune fiche. Commence par créer une fiche guidée.</div>'}</div>`}
function initDraft(f){draft=structuredClone(f||{id:uid(),question:selected.question,title:'',paper:'blank',notes:'',sections:Object.fromEntries(categories.map(([c])=>[c,[]]))});categories.forEach(([c])=>draft.sections[c]??=[])};
function editor(){if(!draft)initDraft(by('fiches',selected.fiche));return crumb()+heading(draft.title||'Nouvelle fiche','Gérer une fiche')+`<div class="panel"><div class="field"><label>Titre de la fiche</label><input data-draft-title value="${esc(draft.title)}" placeholder="Ex. Les indicateurs de performance"></div><div class="grid2"><div class="field"><label>Fond de page</label><select data-paper>${[['blank','Blanc'],['lines','Ligné'],['dots','Pointillé'],['grid','Quadrillé'],['seyes','Seyès (illustratif)']].map(([v,n])=>`<option value="${v}" ${draft.paper===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Notes libres</label><textarea data-notes placeholder="Tes notes personnelles">${esc(draft.notes||'')}</textarea></div></div></div><div class="toolbar">${button('Enregistrer et générer ma fiche','save-fiche')}${button('📓 Cahier numérique','open-notebook','secondary')}${button('Annuler','cancel-editor','light')}</div><div class="sections">${categories.map(([cat,color])=>`<section class="section"><h3 style="color:${color}">● ${cat}</h3>${draft.sections[cat].map((r,i)=>`<div class="bubble-row"><textarea data-cat="${esc(cat)}" data-index="${i}" data-side="left" placeholder="Mot, auteur, notion…">${esc(r.left)}</textarea><textarea data-cat="${esc(cat)}" data-index="${i}" data-side="right" placeholder="Définition, explication, théorie…">${esc(r.right)}</textarea><button title="Supprimer la ligne" data-delrow="${esc(cat)}" data-index="${i}">✕</button></div>`).join('')}<button class="btn secondary small" data-addrow="${esc(cat)}">＋ Ajouter une ligne</button></section>`).join('')}</div><div class="toolbar">${button('Enregistrer et générer ma fiche','save-fiche')}</div>`}
function notebookLegacy(){if(!draft)initDraft(by('fiches',selected.fiche));return crumb()+heading('Mon cahier numérique','Rédaction libre')+`<p class="muted">Écris et mets en forme ton cours. Le cahier est conservé dans la même fiche que tes notions.</p><div class="panel"><div class="field"><label>Titre de la fiche</label><input data-draft-title value="${esc(draft.title)}"></div><div class="field"><label>Fond du cahier</label><select data-paper>${[['blank','Blanc'],['lines','Ligné'],['dots','Pointillé'],['grid','Quadrillé'],['seyes','Seyès']].map(([v,n])=>`<option value="${v}" ${draft.paper===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="notebook-tools"><button data-format="bold" title="Gras"><b>G</b></button><button data-format="italic" title="Italique"><i>I</i></button><button data-format="underline" title="Souligné"><u>S</u></button><button data-format="insertUnorderedList">• Liste</button><button data-format="insertOrderedList">1. Liste</button><button data-format="formatBlock" data-format-value="h2">Titre</button><button data-format="formatBlock" data-format-value="p">Paragraphe</button><button data-action="insert-table">▦ Tableau</button></div><div id="notebookContent" class="notebook ${draft.paper==='blank'?'':'paper-'+draft.paper}" contenteditable="true" aria-label="Cahier numérique">${draft.notebook||''}</div><div class="toolbar">${button('Enregistrer ma fiche','save-fiche')}${button('← Retour à la fiche guidée','back-editor','light')}</div></div>`}
function sheet(){let f=by('fiches',selected.fiche);if(!f)return '<p>Fiche introuvable.</p>';let q=by('questions',f.question),t=by('themes',q?.theme),p=by('programs',t?.program);return `<div class="toolbar">${button('← Mes fiches','back-fiches','light')}${button('Modifier la fiche','edit-fiche','secondary')}${button('📓 Cahier numérique','edit-notebook','secondary')}${button('Fiche complète','view-full',mode==='full'?'':'light')}${button('Synthèse interactive','view-summary',mode==='summary'?'':'light')}${button('Imprimer / PDF','print','light')}</div><article class="sheet ${f.paper==='blank'?'':'paper-'+f.paper}"><div class="sheet-head">${esc(p?.discipline||'')} · ${esc(p?.name||'')}<div>Thème : ${esc(t?.name||'')}</div><div>${esc(q?.name||'')}</div></div><h1>${esc(f.title)}</h1>${mode==='summary'?`<p class="muted">Touche chaque notion pour révéler son contenu original.</p><div class="toolbar">${button('Tout afficher','reveal-all','secondary small')}${button('Tout masquer','hide-all','light small')}</div>`:''}${categories.map(([cat,color])=>{let rows=(f.sections||{})[cat]||[];if(!rows.length)return '';return `<section style="margin-bottom:24px"><h3 style="color:${color};border-bottom:1px solid ${color}44;padding-bottom:8px">${esc(cat)}</h3>${mode==='full'?rows.map(r=>`<div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin:8px 0"><div class="term">${esc(r.left)}</div><div class="definition">${esc(r.right)}</div></div>`).join(''):rows.map((r,i)=>{let k=cat+'|'+i;return `<div><button class="chip" data-reveal="${esc(k)}" style="border-left:4px solid ${color}">${esc(r.left)} ${revealed.has(k)?'−':'＋'}</button>${revealed.has(k)?`<div class="answer">${esc(r.right)}</div>`:''}</div>`}).join('')}</section>`}).join('')}${mode==='full'&&f.notebook?`<h3>Cahier numérique</h3><div class="definition" style="white-space:normal">${f.notebook}</div>`:''}${mode==='full'&&f.notes?`<h3>Notes personnelles</h3><div class="definition">${esc(f.notes)}</div>`:''}</article>`}
function revision(){let fs=db.fiches;return heading('Révisions','Mémorisation active')+`<p class="muted">Choisis une fiche pour réviser uniquement les notions de gauche et révéler leurs explications au toucher.</p><div class="panel">${fs.length?fs.map(f=>`<div class="entry"><button class="link" data-revise="${f.id}">${esc(f.title)}</button><span class="pill">${Object.values(f.sections||{}).reduce((n,r)=>n+r.length,0)} notions</span></div>`).join(''):'<div class="empty">Crée d’abord une fiche depuis « Mes cours ».</div>'}</div>`}
function syncPage(){return window.capSync?window.capSync.page():heading('Synchronisation')+'<p>Chargement…</p>'}
function backup(){return heading('Sauvegarde et restauration','Mes données')+`<div class="panel"><p>Les fiches sont conservées dans le stockage local de ce navigateur. Pour éviter une perte, télécharge une sauvegarde JSON.</p><div class="toolbar">${button('↓ Exporter toutes mes données','export')}${button('↑ Importer une sauvegarde','import','secondary')}</div><input id="importfile" type="file" accept=".json,application/json" class="hidden"><div class="notice">L’importation remplace les données actuellement enregistrées. Pour synchroniser entre appareils, ouvre ☁ Sync et connecte ton compte.</div></div>`}
function add(kind){let label={programs:'Nom du programme',themes:'Nom du thème',questions:'Question de gestion ou problématique'}[kind];let v=prompt(label);if(!v?.trim())return;let obj={id:uid(),name:v.trim()};if(kind==='programs')obj.discipline=selected.discipline;if(kind==='themes')obj.program=selected.program;if(kind==='questions')obj.theme=selected.theme;db[kind].push(obj);save();render()}
function editItem(kind,id){let item=by(kind,id);if(!item)return;let v=prompt('Modifier le nom',item.name);if(v===null)return;if(!v.trim()){alert('Le nom ne peut pas être vide.');return}item.name=v.trim();save();render()}
function remove(kind,id){if(!confirm('Supprimer cet élément ? Cette action peut rendre des éléments liés inaccessibles.'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-page],[data-discipline],[data-select],[data-open-fiche],[data-revise],[data-edit]');if(!b)return;if(b.dataset.format){document.getElementById('notebookContent')?.focus();document.execCommand(b.dataset.format,false,b.dataset.formatValue||null);return}if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.discipline){selected={discipline:b.dataset.discipline,program:'',theme:'',question:'',fiche:''};navigate('programs');return}if(b.dataset.select){let k=b.dataset.select,id=b.dataset.id;if(k==='programs'){selected.program=id;selected.theme='';selected.question='';navigate('themes')}if(k==='themes'){selected.theme=id;selected.question='';navigate('questions')}if(k==='questions'){selected.question=id;navigate('fiches')}return}if(b.dataset.openFiche||b.dataset.revise){selected.fiche=b.dataset.openFiche||b.dataset.revise;mode=b.dataset.revise?'summary':'full';revealed.clear();navigate('sheet');return}if(b.dataset.edit){editItem(b.dataset.edit,b.dataset.id);return}if(b.dataset.remove){remove(b.dataset.remove,b.dataset.id);return}if(b.dataset.addrow){draft.sections[b.dataset.addrow].push({left:'',right:''});render();return}if(b.dataset.delrow){draft.sections[b.dataset.delrow].splice(+b.dataset.index,1);render();return}if(b.dataset.reveal){let k=b.dataset.reveal;revealed.has(k)?revealed.delete(k):revealed.add(k);render();return}let a=b.dataset.action;if(!a)return;if(a.startsWith('add-')){add(a.slice(4));return}switch(a){case'go-back':{if((page==='editor'||page==='notebook')&&draft&&!confirm('Quitter sans enregistrer les modifications ?'))return;if(page==='editor'||page==='notebook')draft=null;let prev=historyPages.pop()||'home';navigate(prev,false);break}case'new-fiche':selected.fiche='';initDraft(null);navigate('editor');break;case'edit-notebook':initDraft(by('fiches',selected.fiche));navigate('notebook');break;case'edit-fiche':initDraft(by('fiches',selected.fiche));navigate('editor');break;case'save-fiche':if(window.capStudio)window.capStudio.capture();if(!draft.title.trim()){alert('Ajoute un titre à la fiche.');return}draft.sections=Object.fromEntries(categories.map(([c])=>[c,draft.sections[c].filter(r=>r.left.trim()||r.right.trim())]));let ix=db.fiches.findIndex(x=>x.id===draft.id);if(ix<0)db.fiches.push(draft);else db.fiches[ix]=draft;selected.fiche=draft.id;save();draft=null;mode='full';navigate('sheet');break;case'back-editor':navigate('editor');break;case'insert-table':{let ed=document.getElementById('notebookContent');if(ed){ed.focus();document.execCommand('insertHTML',false,'<table border="1" style="border-collapse:collapse;width:100%"><tbody><tr><td>Cellule</td><td>Cellule</td></tr><tr><td>Cellule</td><td>Cellule</td></tr></tbody></table><p></p>')}break}case'open-notebook':navigate('notebook');break;case'cancel-editor':draft=null;navigate(selected.fiche?'sheet':'fiches');break;case'back-questions':navigate('questions');break;case'back-fiches':navigate('fiches');break;case'view-full':mode='full';render();break;case'view-summary':mode='summary';revealed.clear();render();break;case'reveal-all':{let f=by('fiches',selected.fiche);categories.forEach(([c])=>(f.sections[c]||[]).forEach((_,i)=>revealed.add(c+'|'+i)));render();break}case'hide-all':revealed.clear();render();break;case'print':window.print();break;case'export':{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cap-agreg-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);break}case'import':document.getElementById('importfile').click();break}});
document.addEventListener('input',e=>{let t=e.target;if(!draft)return;if(t.id==='notebookContent')draft.notebook=t.innerHTML;if(t.hasAttribute('data-draft-title'))draft.title=t.value;if(t.hasAttribute('data-notes'))draft.notes=t.value;if(t.dataset.cat){draft.sections[t.dataset.cat][+t.dataset.index][t.dataset.side]=t.value}});document.addEventListener('change',async e=>{let t=e.target;if(t.hasAttribute('data-paper')&&draft){draft.paper=t.value;let ed=document.getElementById('notebookContent');if(ed)ed.className='notebook '+(draft.paper==='blank'?'':'paper-'+draft.paper)}if(t.id==='importfile'&&t.files[0]){try{let obj=JSON.parse(await t.files[0].text());if(!['programs','themes','questions','fiches'].every(k=>Array.isArray(obj[k])))throw Error('Format invalide');if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){db=obj;save();navigate('home')}}catch(err){alert('Impossible d’importer ce fichier : '+err.message)}}});render();if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script><script src="studio.js"></script><script src="sync.js"></script></body></html>
